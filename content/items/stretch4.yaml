# The Cinder Reach item corpus — pool.stretch4, levels 23-30.
#
# The first pool whose item levels cross ilvl 30, which is where affix tier 3
# unlocks (content/affixes/stretch1.yaml). That is the wave's item-side step: the
# bases are ordinary, the *rolls* on them are not, so the reason to keep farming
# the Reach is a better roll rather than a better base.
#
# See content/items/stretch2.yaml for how requirements are sized.

