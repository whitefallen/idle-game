# Drop tables for the Drowned Span (beacon-line stretch 2.5).
#
# These draw from pool.stretch2 rather than a pool of their own. A wave earns a
# new item pool when it wants to drop different *kinds* of thing, not merely
# stronger ones — item level is what scales an item's power (docs/items.md
# section 3) — and the Span wants exactly the Causeway's kit at the top of its
# item-level band.
#
# Rarity is rolled separately from the item pool, so rarity distribution is
# tuned in one place. See docs/items.md section 8.

- id: droptable.stretch2_5.patrol
  rolls: 1
  entries:
    - weight: 5300
      type: nothing
    - weight: 3200
      type: material
      materialId: material.emberash
      quantity: [2, 5]
    - weight: 200
      type: material
      materialId: material.blightcore
      quantity: [1, 1]
    - weight: 1300
      type: item
      pool: pool.stretch2
      ilvlRange: [9, 14]

- id: droptable.stretch2_5.elite
  rolls: 2
  entries:
    - weight: 2700
      type: nothing
    - weight: 3400
      type: material
      materialId: material.emberash
      quantity: [3, 8]
    - weight: 500
      type: material
      materialId: material.blightcore
      quantity: [1, 3]
    - weight: 3400
      type: item
      pool: pool.stretch2
      ilvlRange: [11, 16]
