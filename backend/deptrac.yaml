# Layering enforcement.
#
# Dependencies point inward only: Http -> Application -> Domain. The Domain
# layer imports nothing from Symfony, Doctrine or Platform.
#
# This is enforced by a failing build rather than by convention because layering
# decays under deadline pressure. See docs/architecture.md section 2.

deptrac:
  paths:
    - ./src

  layers:
    - name: Domain
      collectors:
        - type: directory
          value: src/Feature/[^/]+/Domain/.*

    - name: Application
      collectors:
        - type: directory
          value: src/Feature/[^/]+/Application/.*

    - name: Infrastructure
      collectors:
        - type: directory
          value: src/Feature/[^/]+/Infrastructure/.*

    - name: Http
      collectors:
        - type: directory
          value: src/Feature/[^/]+/Http/.*

    # Cross-cutting technical capability. If it encodes a game rule it belongs
    # in a Feature; if it would be recognisable in a non-game application it
    # belongs here.
    - name: Platform
      collectors:
        - type: directory
          value: src/Platform/.*

    # Everything Symfony except the Uid component, which is separated below.
    - name: Symfony
      collectors:
        - type: classNameRegex
          value: '#^Symfony\\(?!Component\\Uid\\)#'

    # Value types with no framework coupling: no container, no I/O, no
    # configuration. Treating them as a separate layer lets the Domain hold a
    # proper identifier type without opening the door to the framework.
    - name: Uid
      collectors:
        - type: classNameRegex
          value: '#^Symfony\\Component\\Uid\\#'

    # Everything Doctrine except the declarative mapping attributes.
    - name: Doctrine
      collectors:
        - type: classNameRegex
          value: '#^Doctrine\\(?!ORM\\Mapping\\)#'

    # Mapping attributes are metadata, not behaviour: they describe how an
    # entity is stored but cannot perform persistence. Allowing them in the
    # Domain keeps entities readable in one file, while the rule that matters —
    # no EntityManager, no repository, no query in the Domain — is still
    # enforced by the Doctrine layer above.
    - name: DoctrineMapping
      collectors:
        - type: classNameRegex
          value: '#^Doctrine\\ORM\\Mapping\\#'

    - name: Psr
      collectors:
        - type: classNameRegex
          value: '#^Psr\\#'

    # Third-party libraries are enumerated rather than blanket-allowed, so that
    # a new vendor dependency surfaces as an uncovered violation and has to be
    # granted to a layer deliberately.
    - name: JsonSchema
      collectors:
        - type: classNameRegex
          value: '#^Opis\\JsonSchema\\#'

  ruleset:
    # The Domain depends on no outward layer, and on neither the framework nor
    # persistence. This is the rule that matters most: it is what keeps the
    # combat engine unit-testable without a kernel.
    #
    # Domain -> Domain is permitted so that one feature can use another's shared
    # value objects (Encounter builds Combat's Participant, for instance).
    # Feature isolation across the *application* layer is still enforced, and
    # architecture.md section 3.1 remains the rule for behaviour: features
    # communicate through events, never by calling each other's services.
    Domain:
      - Domain
      - Uid
      - DoctrineMapping

    Application:
      - Domain
      - Platform
      - Symfony
      - Uid

    Infrastructure:
      - Domain
      - Application
      - Platform
      - Symfony
      - Uid
      - Doctrine
      - DoctrineMapping
      - Psr

    Http:
      - Domain
      - Application
      - Platform
      - Symfony
      - Uid

    Platform:
      - Symfony
      - Uid
      - Doctrine
      - DoctrineMapping
      - JsonSchema
      - Psr
