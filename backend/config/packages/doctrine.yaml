doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            # Time-ordered UUIDv7 primary keys throughout. See ADR-0005.
            uuid: Symfony\Bridge\Doctrine\Types\UuidType

    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false

        # One mapping per feature, mirroring the feature-first layout. Entities
        # live in each feature's Domain layer; only declarative mapping
        # attributes are permitted there, never persistence behaviour.
        # See deptrac.yaml.
        mappings:
            Account:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Feature/Account/Domain/Entity'
                prefix: 'App\Feature\Account\Domain\Entity'
                alias: Account
            Character:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Feature/Character/Domain/Entity'
                prefix: 'App\Feature\Character\Domain\Entity'
                alias: Character
            Inventory:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Feature/Inventory/Domain/Entity'
                prefix: 'App\Feature\Inventory\Domain\Entity'
                alias: Inventory
            Encounter:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Feature/Encounter/Domain/Entity'
                prefix: 'App\Feature\Encounter\Domain\Entity'
                alias: Encounter
            Holding:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Feature/Holding/Domain/Entity'
                prefix: 'App\Feature\Holding\Domain\Entity'
                alias: Holding

            # Platform owns two tables of its own: the transactional outbox and
            # idempotency records. Both are technical capabilities rather than
            # game domain, which is why they live here.
            Outbox:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Platform/Outbox'
                prefix: 'App\Platform\Outbox'
                alias: Outbox
            Idempotency:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Platform/Idempotency'
                prefix: 'App\Platform\Idempotency'
                alias: Idempotency
            Audit:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Platform/Audit'
                prefix: 'App\Platform\Audit'
                alias: Audit

        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
