  effectId: effect.resolve
  effectChanceBp: 10000

- id: ability.sunder
  localisationKey: ability.sunder
  focusCost: 8
  cooldownRounds: 3
  damageCoefficientBp: 5000
  healCoefficientBp: 0
  school: physical
  selector: highest_health_enemy
  effectId: effect.sundered
  effectChanceBp: 9000

# Monster-only. Kept in the same pool because the engine draws no distinction
