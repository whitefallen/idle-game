# Low damage, high application chance: it is a debuff wearing an attack's
# clothes. The sentinel casting this is not trying to kill the player, it is
# trying to make the player's next three turns worth less.
- id: ability.ash_shroud
  localisationKey: ability.ash_shroud
  focusCost: 10
  cooldownRounds: 3
  damageCoefficientBp: 4000
  healCoefficientBp: 0
  school: arcane
  selector: lowest_health_enemy
  effectId: effect.ash_choked
  effectChanceBp: 8500

- id: ability.ember_reave
  localisationKey: ability.ember_reave
