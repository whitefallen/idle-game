; Shared PHP configuration for every target.
memory_limit = 512M
max_execution_time = 30

; Determinism: the combat engine must never observe a locale- or timezone-
; dependent value. See docs/combat.md rule R4.
date.timezone = UTC

; Errors are logged, never rendered. docs/api.md section 2.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Serialising large combat logs and content registries.
serialize_precision = -1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
