# The boss's emergency heal. Priced so it can fire roughly twice in a fight of
# the intended length, and coefficient-limited so it buys rounds rather than
# undoing the fight: a heal a player cannot out-damage is a stalemate, and the
# round cap treats a stalemate as a design failure, not a player failure.
- id: ability.vault_mend
  localisationKey: ability.vault_mend
  focusCost: 20
  cooldownRounds: 6
  damageCoefficientBp: 0
  healCoefficientBp: 9000
  school: nature
  selector: self
