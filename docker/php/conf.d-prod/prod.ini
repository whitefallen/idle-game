; Production overrides. Loaded after app.ini.
opcache.validate_timestamps = 0
opcache.preload_user = www-data

; PHP advertises its exact version in an X-Powered-By response header by
; default, which hands an attacker the list of CVEs to try. nginx already hides
; its own version for the same reason. docs/api.md section 2.
expose_php = Off
