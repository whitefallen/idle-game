# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # The content library lives outside backend/ because it is authored by
    # designers and validated by its own CI job. See docs/architecture.md.
    app.content_dir: '%env(resolve:CONTENT_DIR)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        # Lets content:validate discover every feature's content without
        # Platform depending on any feature. See ADR notes in ContentProvider.
        App\Platform\Content\ContentProvider:
            tags: ['app.content_provider']

    App\:
        resource: '../src/'
        exclude:
            # Value objects, entities and pure static rule classes are not
            # services; registering them would create definitions the container
            # can never autowire.
            - '../src/Kernel.php'
            - '../src/**/Domain/Model/'
            - '../src/**/Domain/Entity/'
            - '../src/**/Domain/Event/'
            - '../src/**/Domain/Rng/'
            - '../src/**/Domain/Service/'
            - '../src/Feature/Encounter/Application/ResolvedEncounter.php'
            - '../src/Feature/Holding/Application/ClaimedHolding.php'
            - '../src/Platform/Outbox/OutboxMessage.php'
            - '../src/Platform/Outbox/DomainEventNotification.php'
            - '../src/Platform/Idempotency/IdempotencyRecord.php'
            - '../src/Platform/Audit/AuditEntry.php'
            - '../src/Platform/Retention/RetentionPolicy.php'
            - '../src/Feature/Inventory/Domain/Entity/'
            - '../src/**/Domain/Engine/CombatantState.php'
            - '../src/**/Domain/Engine/SelectedAction.php'
            - '../src/Platform/Content/ContentIssue.php'
            - '../src/Platform/Http/ApiException.php'
            - '../src/Platform/Http/JsonBody.php'
            - '../src/Platform/Persistence/DuplicateKeyException.php'

    # ------------------------------------------------------------------
    # Content pipeline
    # ------------------------------------------------------------------

    App\Platform\Content\JsonSchemaValidator:
        arguments:
            $schemaDirectory: '%app.content_dir%/schema'

    App\Platform\Content\ContentSource:
        arguments:
            $contentDirectory: '%app.content_dir%'

    # ------------------------------------------------------------------
    # Repository bindings. Domain declares the interface; Infrastructure
    # supplies the implementation.
    # ------------------------------------------------------------------

    App\Feature\Combat\Domain\Repository\AbilityRepository:
        alias: App\Feature\Combat\Infrastructure\Content\YamlAbilityRepository

    App\Feature\Combat\Domain\Repository\EffectRepository:
        alias: App\Feature\Combat\Infrastructure\Content\YamlEffectRepository

    App\Feature\Encounter\Domain\Repository\MonsterRepository:
        alias: App\Feature\Encounter\Infrastructure\Content\YamlMonsterRepository

    App\Feature\Encounter\Domain\Repository\EncounterDefinitionRepository:
        alias: App\Feature\Encounter\Infrastructure\Content\YamlEncounterDefinitionRepository

    App\Feature\Account\Domain\Repository\AccountRepository:
        alias: App\Feature\Account\Infrastructure\Doctrine\DoctrineAccountRepository

    App\Feature\Character\Domain\Repository\CharacterRepository:
        alias: App\Feature\Character\Infrastructure\Doctrine\DoctrineCharacterRepository

    App\Feature\Character\Domain\Repository\DisciplineRepository:
        alias: App\Feature\Character\Infrastructure\Content\YamlDisciplineRepository

    App\Feature\Encounter\Domain\Repository\EncounterRepository:
        alias: App\Feature\Encounter\Infrastructure\Doctrine\DoctrineEncounterRepository

    App\Feature\Inventory\Domain\Repository\AffixRepository:
        alias: App\Feature\Inventory\Infrastructure\Content\YamlAffixRepository

    App\Feature\Inventory\Domain\Repository\ItemDefinitionRepository:
        alias: App\Feature\Inventory\Infrastructure\Content\YamlItemDefinitionRepository

    App\Feature\Inventory\Domain\Repository\DropTableRepository:
        alias: App\Feature\Inventory\Infrastructure\Content\YamlDropTableRepository

    App\Feature\Inventory\Domain\Repository\ItemInstanceRepository:
        alias: App\Feature\Inventory\Infrastructure\Doctrine\DoctrineItemInstanceRepository

    App\Feature\Inventory\Domain\Repository\MaterialRepository:
        alias: App\Feature\Inventory\Infrastructure\Content\YamlMaterialRepository

    App\Feature\Inventory\Domain\Repository\MaterialStackRepository:
        alias: App\Feature\Inventory\Infrastructure\Doctrine\DoctrineMaterialStackRepository

    App\Feature\Holding\Domain\Repository\HoldingRepository:
        alias: App\Feature\Holding\Infrastructure\Doctrine\DoctrineHoldingRepository

    # ------------------------------------------------------------------
    # Platform services
    # ------------------------------------------------------------------

    App\Platform\Clock\Clock:
        alias: App\Platform\Clock\SystemClock

    App\Platform\Uid\IdentifierGenerator:
        alias: App\Platform\Uid\UuidV7Generator

    App\Platform\Persistence\TransactionManager:
        alias: App\Platform\Persistence\DoctrineTransactionManager

    App\Platform\Random\SeedGenerator:
        alias: App\Platform\Random\CryptoSeedGenerator

    App\Platform\Outbox\OutboxRecorder:
        alias: App\Platform\Outbox\DoctrineOutboxRecorder

    App\Platform\Audit\AuditLogger:
        alias: App\Platform\Audit\DoctrineAuditLogger

    App\Platform\Audit\DoctrineAuditLogger:
        arguments:
            # Salts the client address hash. Using the application secret means
            # the same address hashes differently per deployment, so digests
            # cannot be correlated between environments or precomputed.
            $hashSalt: '%env(APP_SECRET)%'

    App\Platform\Security\PasswordHasher:
        alias: App\Platform\Security\SymfonyPasswordHasher

    App\Platform\Security\SymfonyPasswordHasher:
        arguments:
            # Must match the key under security.password_hashers, which is the
            # user class because that is how the security component resolves a
            # hasher when verifying credentials.
            $hasherName: 'App\Feature\Account\Infrastructure\Security\AccountUser'
