; Development performance on bind-mounted sources.
;
; The problem: with opcache.revalidate_freq=0 PHP stats every included file on
; every request to check whether it changed. A Symfony request loads on the
; order of 1700 files, and a stat on a Windows/macOS bind mount costs about
; 2.4ms against 0.002ms on a native volume — measured in this project. That is
; roughly four seconds of pure filesystem overhead per request, and it is the
; entire reason a "slow Symfony" feels slow in Docker on those hosts.
;
; Revalidating at most every two seconds removes almost all of it. The cost is
; that a source edit can take up to two seconds to take effect, which is far
; below the time it takes to alt-tab to a browser.
opcache.revalidate_freq = 2

; The bind mount is also slow to resolve paths, so cache more of them for longer.
realpath_cache_size = 16M
realpath_cache_ttl = 900

; Note: FPM pool settings such as `pm` are not PHP ini directives and cannot be
; set here. They belong in the pool configuration under /usr/local/etc/php-fpm.d.
;
; This file cannot remove the underlying cost, only reduce it. On Windows and
; macOS the durable fix is to keep the repository on a filesystem the Linux VM
; owns — for Windows that means cloning inside WSL2 (\\wsl$\...) rather than
; under C:\Users. Measured here: 2.4ms per stat across the bind mount against
; 0.002ms on a native volume. Production is unaffected: it runs on Linux with
; the source baked into the image and opcache.validate_timestamps=0.
