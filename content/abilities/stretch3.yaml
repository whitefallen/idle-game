# Abilities introduced with beacon-line stretch 3: the Ashen Vault.
#
# The monster abilities here are the boss's phases. Each one is an ordinary
# ability with an ordinary cost and cooldown; what makes the fight feel phased
# is the order they are written in, not any engine support for phases. That is
# the point — a designer can build a new boss without a line of PHP.

# ------------------------------------------------------------------ player kit

# The area answer to the vault's adds, and the first player ability that both
# hits everything and leaves a debuff behind. Expensive and slow enough that it
# is a decision rather than a default: a plan that opens with it every fight
# will run out of Focus before a plan that reserves it for groups.
- id: ability.shattering_arc
  localisationKey: ability.shattering_arc
  focusCost: 18
  cooldownRounds: 3
  damageCoefficientBp: 9000
  healCoefficientBp: 0
  school: physical
  selector: all_enemies
  effectId: effect.sundered
  effectChanceBp: 7000

# ----------------------------------------------------------------- monster kit

- id: ability.cinder_volley
