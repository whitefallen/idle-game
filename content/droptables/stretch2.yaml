# Drop tables for beacon-line stretch 2.
#
# Rarity is rolled separately from the item pool, so rarity distribution is
# tuned in one place rather than duplicated across every table.
# See docs/items.md section 8.
#
# These tables draw from pool.stretch2 (content/items/stretch2.yaml), which is
# also the pool the Drowned Span draws from: the two waves span levels 7-14 and
# want the same *kinds* of item, and item level rather than the pool is what
# scales an item's power (docs/items.md section 3).

- id: droptable.stretch2.patrol
  rolls: 1
  entries:
    - weight: 5500
      type: nothing
    - weight: 3200
      type: material
      materialId: material.emberash
      quantity: [2, 4]
    - weight: 1300
      type: item
      pool: pool.stretch2
      ilvlRange: [6, 12]

- id: droptable.stretch2.elite
  rolls: 2
  entries:
    - weight: 2800
      type: nothing
    - weight: 3400
      type: material
      materialId: material.emberash
      quantity: [3, 7]
    - weight: 400
      type: material
      materialId: material.blightcore
      quantity: [1, 2]
    - weight: 3400
      type: item
      pool: pool.stretch2
      ilvlRange: [9, 15]
