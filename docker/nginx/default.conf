server {
    listen 80;
    server_name _;
    root /app/public;

    # Symfony front controller pattern: everything that is not a real file is
    # routed through index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Combat logs are large; give the buffers room before spilling to disk.
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_read_timeout 30s;

        internal;
    }

    # Any other .php file is not a valid entry point.
    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 2m;

    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    # Internal exceptions are never exposed. docs/api.md section 2.
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
