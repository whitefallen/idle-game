name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Node directly rather than through Docker: unlike the backend there is
      # no runtime image to match, so the container would add a minute per run
      # and prove nothing.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly the committed lockfile and fails
      # if package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      # The production build catches what the dev server does not: type-only
      # imports that survive transpilation, and anything that only fails when
      # the bundle is actually assembled.
      - name: Build
        run: npm run build
