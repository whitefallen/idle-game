# The Sundered Causeway item corpus — pool.stretch2.
#
# Base stats derive from ilvl at runtime (docs/items.md section 3); the
# definition carries identity, slot, requirements and economy values only. That
# is why this file adds *slots and build directions* rather than bigger numbers:
# a second heavy weapon at a higher ilvl would be the same item, and the stat
# budget discipline in docs/progression.md section 2.2 exists to forbid exactly
# that.
#
# The pool covers levels 7-14, so it also serves the Drowned Span (stretch 2.5).
# A wave gets its own pool only when it has a reason to drop different *kinds*
# of thing, not merely stronger ones.
#
# Attribute requirements are sized against roughly half the point budget of a
# character at the required level, so an item is reachable by the build it is
# for and out of reach for a character who has specialised elsewhere. Only
# allocated attributes count toward a requirement (docs/progression.md section
# 2.1), so these cannot be satisfied by stacking other gear.

# The first light weapon in the library. Dexterity-scaled and lower on the
# damage curve than a halberd by design (docs/items.md section 3): the reason to
# carry one is the initiative and dodge a Dexterity build brings with it, not
# the weapon's own number.
- id: item.tidewrought_blade
  localisationKey: item.tidewrought_blade
  slot: MainHand
  twoHanded: false
  weaponClass: light
  ilvl: 10
  icon: items/weapons/tidewrought_blade
  vendorValue: 230
  requirements:
    level: 8
    attributes:
      DEX: 16
  allowedAffixPools:
    - weapon_prefix
    - weapon_suffix
  tags: [causeway, blade, stretch2, pool.stretch2]

