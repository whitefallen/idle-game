; Xdebug is installed but inert by default.
;
; In `develop` mode Xdebug instruments every function call, and a Symfony dev
; kernel makes millions of them: measured here, a request with no password
; hashing and no meaningful work took 4.4 seconds with develop mode on and
; under 200ms with it off. A development environment that slow stops being used.
;
; Xdebug 3 reads the XDEBUG_MODE environment variable in preference to this
; setting, so it can be switched on per-container without editing any file:
;
;   XDEBUG_MODE=debug      docker compose up -d php     (step debugging)
;   XDEBUG_MODE=coverage   make test-coverage           (line coverage)
xdebug.mode = off

xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = trigger
xdebug.idekey = emberwatch
