# Beacon-line stretch 1 bestiary.
#
# Monster stats are authored directly rather than derived from attributes:
# a monster has no equipment, no allocation and no respec, so an attribute
# layer would be indirection with no payoff. Player-side derived stats are
# computed from attributes and gear by the Character feature.

# The first monster a new player meets. Deliberately weak: a level 1 character
# with no allocated points must win this fight nearly every time, because
# losing your first encounter teaches nothing and reads as the game being
# broken. Difficulty arrives with the swarm and the elite.
- id: monster.blightling
  localisationKey: monster.blightling
  level: 2
  maxHealth: 70
  initiative: 80
  maxFocus: 20
  focusPerTurn: 4
  weaponBaseDamage: 8
  flatDamageBonus: 0
  scalingBp: 10000
  critChanceBp: 300
  critPowerBp: 15000
  dodgeChanceBp: 300
  accuracyBp: 0
  armourRating: 40
  resistanceRatings:
    nature: 120
  abilities:
    - ability.blight_lash
  battlePlan:
    - condition:
        - subject: always
      ability: ability.blight_lash

- id: monster.blight_stalker
  localisationKey: monster.blight_stalker
  level: 5
  maxHealth: 150
  initiative: 140
  maxFocus: 30
  focusPerTurn: 5
  weaponBaseDamage: 15
  flatDamageBonus: 2
  scalingBp: 10000
  critChanceBp: 800
  critPowerBp: 16000
  dodgeChanceBp: 900
  accuracyBp: 200
  armourRating: 120
  resistanceRatings:
    nature: 200
    physical: 40
  abilities:
    - ability.blight_lash
    - ability.corrosive_spray
  battlePlan:
    # Opens with the area attack while it still has multiple targets, then
    # falls back to its basic attack.
    - condition:
        - subject: enemy.count
          operator: gte
          value: 2
      ability: ability.corrosive_spray
    - condition:
        - subject: always
      ability: ability.blight_lash
