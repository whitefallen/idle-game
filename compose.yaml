name: emberwatch

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emberwatch
      POSTGRES_USER: emberwatch
      POSTGRES_PASSWORD: emberwatch
      # Deterministic collation. A collation change alters index ordering and
      # would silently corrupt unique constraints on a rebuilt volume.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emberwatch -d emberwatch"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://emberwatch:emberwatch@postgres:5432/emberwatch?serverVersion=17&charset=utf8"
      CONTENT_DIR: /content
      PHP_IDE_CONFIG: serverName=emberwatch
    volumes:
      - ./backend:/app
      - ./content:/content:ro
      - composer-cache:/root/.composer/cache
    healthcheck:
      test: ["CMD-SHELL", "php -v > /dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./backend/public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - nginx
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      # Vite proxies /api to nginx so the browser sees a single origin and no
      # CORS configuration is needed in any environment.
      VITE_API_PROXY_TARGET: http://nginx:80
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  postgres-data:
  composer-cache:
  frontend-node-modules:
