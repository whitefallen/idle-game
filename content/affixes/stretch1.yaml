# Affix pools.
#
# Prefix and suffix are separate pools so that "more damage" and "more
# survivability" cannot both be maximised on one item without cost. An item
# rolls at most one of each kind per affix id, and higher tiers unlock with
# item level. See docs/items.md section 4.
#
# `percent` modifiers apply to the item's own base value for that stat, so they
# are only meaningful on the stats an item actually has a base for.

# ---------------------------------------------------------------- weapons
- id: prefix.honed
  localisationKey: affix.prefix.honed
  pool: weapon_prefix
  kind: prefix
  modifier: { stat: weaponBaseDamage, mode: percent }
  tiers:
    - { tier: 1, minIlvl: 1, roll: [400, 900] }
    - { tier: 2, minIlvl: 15, roll: [1000, 1600] }
    - { tier: 3, minIlvl: 30, roll: [1700, 2400] }

- id: prefix.weighted
  localisationKey: affix.prefix.weighted
  pool: weapon_prefix
  kind: prefix
  modifier: { stat: flatDamage, mode: flat }
  tiers:
    - { tier: 1, minIlvl: 1, roll: [1, 3] }
    - { tier: 2, minIlvl: 15, roll: [4, 8] }
    - { tier: 3, minIlvl: 30, roll: [9, 16] }

- id: suffix.of_the_bear
  localisationKey: affix.suffix.of_the_bear
  pool: weapon_suffix
  kind: suffix
  modifier: { stat: STR, mode: flat }
  tiers:
    - { tier: 1, minIlvl: 1, roll: [1, 3] }
    - { tier: 2, minIlvl: 15, roll: [4, 7] }
    - { tier: 3, minIlvl: 30, roll: [8, 13] }

- id: suffix.of_precision
  localisationKey: affix.suffix.of_precision
  pool: weapon_suffix
  kind: suffix
  modifier: { stat: critChanceBp, mode: flat }
  tiers:
    - { tier: 1, minIlvl: 1, roll: [50, 150] }
    - { tier: 2, minIlvl: 15, roll: [160, 300] }
    - { tier: 3, minIlvl: 30, roll: [310, 500] }

