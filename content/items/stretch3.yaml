# The Ashen Vault item corpus — pool.stretch3, levels 15-22.
#
# The wave that completes the weapon triangle: item.ashcallers_rod is the first
# `focus` weapon in the library, so all three weapon classes in
# docs/items.md section 3 finally have something to equip. Until now an
# Intelligence build had a damage curve on paper and nothing to hold.
#
# See content/items/stretch2.yaml for how requirements are sized.

- id: item.vault_greatmaul
  localisationKey: item.vault_greatmaul
  slot: MainHand
  twoHanded: true
  weaponClass: heavy
  ilvl: 20
  icon: items/weapons/vault_greatmaul
  vendorValue: 470
  requirements:
    level: 16
    attributes:
      STR: 34
  allowedAffixPools:
    - weapon_prefix
    - weapon_suffix
  tags: [vault, maul, stretch3, pool.stretch3]

- id: item.emberglass_edge
  localisationKey: item.emberglass_edge
  slot: MainHand
  twoHanded: false
  weaponClass: light
