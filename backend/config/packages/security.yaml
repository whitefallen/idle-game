security:
    password_hashers:
        # Keyed by the user class, because that is how the security component
        # resolves a hasher when verifying credentials at login. Registration
        # hashes under the same key via App\Platform\Security\PasswordHasher,
        # so both paths always use one configuration.
        App\Feature\Account\Infrastructure\Security\AccountUser:
            algorithm: auto

    providers:
        accounts:
            id: App\Feature\Account\Infrastructure\Security\AccountUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api:
            pattern: ^/api
            lazy: true
            provider: accounts
            stateless: false
            entry_point: App\Feature\Account\Infrastructure\Security\ApiEntryPoint
            access_denied_handler: App\Feature\Account\Infrastructure\Security\ApiAccessDeniedHandler

            # Limits attempts per client address and per username, so a single
            # account cannot be brute-forced from many addresses nor many
            # accounts probed from one. Required by docs/api.md section 5.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            json_login:
                check_path: /api/v1/auth/login
                username_path: email
                password_path: password
                success_handler: App\Feature\Account\Infrastructure\Security\JsonLoginHandler
                failure_handler: App\Feature\Account\Infrastructure\Security\JsonLoginHandler

            logout:
                path: /api/v1/auth/logout
                invalidate_session: true

    access_control:
        # Registration and login must be reachable without a session.
        - { path: ^/api/v1/auth/(register|login)$, roles: PUBLIC_ACCESS }

        # Static game metadata with no user data in it, and it is in the client
        # bundle regardless. Public so it can genuinely be cached — marking an
        # authenticated response publicly cacheable would be the wrong habit
        # even where, as here, the payload happens to be identical for everyone.
        - { path: ^/api/v1/battle-plan/grammar$, roles: PUBLIC_ACCESS }

        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hashing is resource-intensive by design. Tests reduce the cost so
            # the suite stays fast; this must never apply outside the test env.
            App\Feature\Account\Infrastructure\Security\AccountUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
