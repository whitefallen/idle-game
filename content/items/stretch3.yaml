  icon: items/weapons/emberglass_edge
  vendorValue: 440
  requirements:
    level: 16
    attributes:
      DEX: 30
  allowedAffixPools:
    - weapon_prefix
    - weapon_suffix
  tags: [vault, blade, stretch3, pool.stretch3]

# The first focus weapon. Its class multiplier sits between heavy and light
# (docs/items.md section 3), which is the point: an Intelligence build buys its
# advantage in Focus economy — more abilities cast per fight — rather than in
# the weapon's own damage.
- id: item.ashcallers_rod
  localisationKey: item.ashcallers_rod
  slot: MainHand
  twoHanded: false
  weaponClass: focus
  ilvl: 19
