# Encounter definitions for beacon-line stretch 1.
#
# tier selects the XP multiplier applied in the progression rules
# (patrol 10000, elite 25000, boss 60000 basis points).

- id: encounter.stretch1.patrol
  localisationKey: encounter.stretch1.patrol
  level: 2
  tier: patrol
  vigorCost: 10
  requiredLevel: 1
  monsters:
    - monster.blightling
  dropTable: droptable.stretch1.patrol

# Three at once. The step up is mechanical rather than numerical: a single
# strong opponent and three weak ones need different plans, which is what makes
# the area ability worth slotting.
- id: encounter.stretch1.swarm
  localisationKey: encounter.stretch1.swarm
  level: 4
  tier: patrol
  vigorCost: 10
  requiredLevel: 4
  monsters:
    - monster.blightling
    - monster.blightling
    - monster.blightling
  dropTable: droptable.stretch1.patrol

- id: encounter.stretch1.stalker
  localisationKey: encounter.stretch1.stalker
  level: 5
  tier: elite
  vigorCost: 25
  requiredLevel: 4
  monsters:
    - monster.blight_stalker
  dropTable: droptable.stretch1.elite
