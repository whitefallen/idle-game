# ------------------------------------------------------------- jewellery
#
# Rings and amulets carry no base stats at all, so every point of their value
# comes from affixes. That gives them a distinct role — build customisation
# rather than raw power — and keeps the number of stat sources bounded.
- id: prefix.lucky
  localisationKey: affix.prefix.lucky
  pool: jewellery_prefix
  kind: prefix
  modifier: { stat: LUK, mode: flat }
  tiers:
    - { tier: 1, minIlvl: 1, roll: [1, 3] }
    - { tier: 2, minIlvl: 15, roll: [4, 7] }
    - { tier: 3, minIlvl: 30, roll: [8, 13] }

