# Beacon-line stretch 2.5 bestiary: the Drowned Span, levels 13-14.
#
# The half-step between the Sundered Causeway (sustain) and the Ashen Vault
# (phases), and the rung the beacon-line was missing: `round` is the only
# condition subject the Warden of Ash uses that nothing else in the game had
# ever used before it. A player met the boss's round gate having never seen a
# fight where the round number mattered. The Span is where they see it first,
# on one enemy, with nothing else going on.
#
# Its step is therefore the clock: threat that grows with elapsed time rather
# than with the enemy's health. A plan that trades evenly wins the Causeway and
# loses the Span, because on the Span "evenly" is a losing rate.
#
# Stats are authored directly rather than derived from attributes; see the note
# at the top of content/monsters/stretch1.yaml.

# Deliberately unremarkable. It exists to cost the player rounds — the resource
# the herald is actually attacking — rather than health, so its damage is low
# for its level and its health is not.
- id: monster.span_leech
  localisationKey: monster.span_leech
  level: 13
  maxHealth: 260
  initiative: 145
  maxFocus: 30
  focusPerTurn: 5
  weaponBaseDamage: 24
  flatDamageBonus: 2
  scalingBp: 10000
  critChanceBp: 700
  critPowerBp: 16000
  dodgeChanceBp: 500
  accuracyBp: 200
  armourRating: 180
  resistanceRatings:
    physical: 80
    nature: 160
  abilities:
    - ability.blight_lash
    - ability.rending_claw
  battlePlan:
    - condition:
        - subject: always
      ability: ability.rending_claw
    - condition:
        - subject: always
      ability: ability.blight_lash

# The lesson, and the first battle plan in the library that reads as a schedule
# rather than as a set of reactions. Nothing in it mentions health — not its own
# and not the player's — which is exactly what makes it teach: the player cannot
# make this fight easier by being healthy, only by being fast.
#
# Rounds 1-3 it is a mediocre elite. Round 4 it turns the clock on. Round 6 it
# starts collecting. A player who has not won by then is not going to.
- id: monster.tide_herald
  localisationKey: monster.tide_herald
  level: 14
  maxHealth: 820
  initiative: 150
  maxFocus: 44
  focusPerTurn: 6
  weaponBaseDamage: 34
  flatDamageBonus: 3
  scalingBp: 10000
  critChanceBp: 1000
  critPowerBp: 17000
  dodgeChanceBp: 700
  accuracyBp: 400
  armourRating: 340
  resistanceRatings:
    physical: 100
    nature: 240
  abilities:
    - ability.blight_lash
    - ability.call_the_tide
    - ability.tidal_surge
  battlePlan:
    # Written top-down as the clock runs. The surge is first because by the time
    # it is legal it is always the right move; it simply falls through on the
    # rounds it is on cooldown or unaffordable.
    - condition:
        - subject: round
          operator: gte
          value: 6
      ability: ability.tidal_surge

    # The turn it spends buying the rest of the fight. Gated late enough that
    # the player gets three clean rounds first — the same courtesy the Warden of
    # Ash extends, for the same reason.
    - condition:
        - subject: round
          operator: gte
          value: 4
      ability: ability.call_the_tide

    - condition:
        - subject: always
      ability: ability.blight_lash
