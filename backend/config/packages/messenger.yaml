framework:
    messenger:
        failure_transport: failed

        buses:
            messenger.bus.default:
                # A domain event with no subscriber is a normal state, not an
                # error: the outbox relay publishes every event regardless of
                # who is listening, and features subscribe as they are built.
                default_middleware:
                    allow_no_handlers: true

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 2000
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed'

        routing:
            # Relayed domain events are handled out of band. Delivery is
            # at-least-once, so every subscriber must be idempotent.
            # See ADR-0004.
            App\Platform\Outbox\DomainEventNotification: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
