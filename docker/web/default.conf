# Production nginx. Serves the built SPA and routes /api to PHP-FPM.
#
# The development counterpart is docker/nginx/default.conf, which fronts the
# API only — Vite serves the frontend there. The FastCGI tuning is deliberately
# identical in both so a buffering or timeout problem cannot appear for the
# first time in production.

# Whether the original client request was HTTPS, derived from
# X-Forwarded-Proto rather than assumed. This container is never reached
# directly — TLS may be terminated by Caddy (docs/deployment.md section 3.5,
# "Caddy owns the edge") or by an operator's own proxy in front of it
# ("something else already owns the edge"); either is expected to set this
# header. Hardcoding fastcgi_param HTTPS to a fixed value here previously
# caused a real outage: PHP believed every request was HTTPS when it wasn't,
# Symfony's session cookie defaulted to Secure, and every browser silently
# discarded it over the plain-HTTP connection that actually existed, breaking
# login. Deriving it keeps this file correct regardless of which of those two
# topologies is in front of it, without needing to remember to flip anything.
map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;

    # The real client address is Caddy's job to forward; it is the only thing
    # that talks to this server. See docker/caddy/Caddyfile.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Liveness for the container healthcheck and for Caddy's upstream checks.
    # Answered by nginx directly so it reports the web tier, not the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ^~ so no regex location can steal an API request. Every route the backend
    # exposes lives under /api/v1.
    location ^~ /api {
        root /app/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        root /app/public;

        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $fastcgi_https;

        # Combat logs are large; give the buffers room before spilling to disk.
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_read_timeout 30s;

        internal;
    }

    # Any other .php file is not a valid entry point.
    location ~ \.php$ {
        return 404;
    }

    root /srv/app;

    # Vite emits content-hashed filenames, so a build's assets can never be
    # served stale. index.html is deliberately excluded: it is the document
    # that points at the new hashes, and a cached copy would pin returning
    # players to the previous deployment's bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback. Client-side routes are not files on disk.
    location / {
        try_files $uri /index.html;
    }

    client_max_body_size 2m;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Internal exceptions are never exposed. docs/api.md section 2.
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
