name: Docs

# Path-filtered like the other workflows (see ADR-0001): a backend- or
# frontend-only change does not touch the design record and should not
# rebuild it.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deploys should never be cancelled mid-flight by a newer push landing
# on the same ref — a cancelled deploy can leave the published site on a
# half-written build. Only one job group, unlike the cancel-in-progress
# concurrency the other workflows use for the same reason they can afford to:
# theirs only ever discards test output, never a live artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/configure-pages@v5

      - name: Build
        run: npm run docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # Deploys only from main. A pull request builds the site to prove it still
  # builds — dead links, bad frontmatter, a broken config change — without
  # publishing a preview no one asked for.
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
